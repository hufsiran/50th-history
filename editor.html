<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>50주년사 링크 설정 도우미</title><link rel="stylesheet" href="style.css"><style>body{height:auto;min-height:100vh;overflow:auto;background:#172b2b}.editor{padding:24px;max-width:1200px;margin:auto;width:100%}.editor h1{font-size:26px}.editor p{line-height:1.8;color:var(--muted);font-size:13px}.toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:18px}.workspace{display:grid;grid-template-columns:minmax(0,2fr) minmax(260px,1fr);gap:24px}.canvas{position:relative;align-self:start;touch-action:none;background:#eee;cursor:crosshair}.canvas>img{display:block;width:100%;pointer-events:none}.region{position:absolute;border:2px solid #e16c3b;background:#ef9b3529;color:#111;pointer-events:none}.region span{background:#fff;font-size:10px;padding:2px}.fields{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}.fields input{width:100%}.full{display:block;width:100%;margin:7px 0 14px}input,textarea{background:#ffffff0b;color:#fff;border:1px solid var(--border);border-radius:6px;padding:9px}textarea{min-height:120px;width:100%}label{display:block}#linkList button{display:block;width:100%;text-align:left;margin-top:8px;font-size:12px;overflow-wrap:anywhere}.notice{border-left:3px solid var(--gold);padding-left:14px}.editor a{color:var(--gold)}@media(max-width:760px){.workspace{grid-template-columns:1fr}.editor{padding:16px}}</style><script defer src="editor.js"></script></head>
<body><main class="editor"><a href="index.html">← 뷰어로 돌아가기</a><h1>링크 설정 도우미</h1><p class="notice">이 화면은 설정 파일을 만드는 도구입니다. 페이지에서 영역을 그린 뒤 주소를 입력하세요. ‘설정 다운로드’로 받은 config.json을 GitHub 저장소의 기존 파일과 교체하면 방문자에게 반영됩니다. 이 화면에서의 변경은 자동으로 서버에 저장되지 않습니다.</p><div class="toolbar"><label>페이지 <input id="editorPage" type="number" min="1" value="1" style="width:75px"></label><button id="loadPage">보기</button><label>기존 설정 불러오기 <input id="importConfig" type="file" accept="application/json,.json"></label><button id="download" class="primary">설정 다운로드</button></div><div class="workspace"><div id="canvas" class="canvas"><img id="pageImage" alt="링크 영역 편집용 페이지"></div><section><h2>화면·재생 설정</h2><label>제목<input id="editTitle" class="full"></label><div class="toolbar"><label>넘김 간격(초)<input id="editSpeed" type="number" min="2" max="600" style="width:75px"></label><label>기본 음량(%)<input id="editVolume" type="number" min="0" max="100" style="width:75px"></label></div><label><input id="editLoop" type="checkbox">마지막 페이지 뒤 처음부터 반복</label><h2>링크 영역</h2><p>그림에서 누른 채 끌어서 사각형을 그리세요. 좌표는 페이지 대비 %입니다.</p><label>연결 주소<input id="linkURL" class="full" type="url" placeholder="https://..."></label><label>링크 설명<input id="linkLabel" class="full" placeholder="예: 노루즈 행사 영상 보기"></label><div class="fields"><label>X %<input id="x" type="number" step="0.01"></label><label>Y %<input id="y" type="number" step="0.01"></label><label>너비 %<input id="width" type="number" step="0.01"></label><label>높이 %<input id="height" type="number" step="0.01"></label></div><div class="toolbar" style="margin-top:12px"><button id="saveLink">영역 저장</button><button id="newLink">새 영역</button><button id="deleteLink">선택 영역 삭제</button></div><div id="linkList"></div><h2>목차 설정</h2><p>한 줄에 ‘페이지 번호 | 목차 제목’ 형식으로 입력하세요.</p><textarea id="tocText" aria-label="목차 편집"></textarea><p id="editorStatus" role="status"></p></section></div></main></body></html>
